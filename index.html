<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lista de Tarefas</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Lista de Tarefas</h1>
      <p>Adicione suas tarefas!</p>
      <input type="text" id="inputTarefa" placeholder="Digite a sua tarefa" />
      <div class="input-imagem-container">
        <p>Adicione uma imagem (PNG) opcional:</p>
        <input type="file" id="inputImagem" accept="image/png" />
      </div>
      <button onclick="adicionarTarefa()">Adicionar Tarefa</button>
      <p id="mensagem"></p>
      <ul id="listaTarefas"></ul>
      <p class="observacao">💡 Você pode reorganizar as tarefas arrastando-as com o mouse.</p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
